<style>
body{

margin:0;
color:#333
}

header{

color:#fff;

main{

inset:0;
background:rgba(0,0,0,.75);

}

.popupBox{

max-width:90vw;

}

.popupBox img{

}

#closeBtn{
position:absolute;
top:8px;
right:8px;
width:36px;
height:36px;
border-radius:50%;
border:none;
background:#ff3b30;
color:#fff;
font-size:18px;
cursor:pointer;
z-index:10
}
</style>
</head>

<body>

<!-- ===== POPUP ===== -->

<div id="popupOverlay">

<div class="popupBox">

<button id="closeBtn">✕</button>

<img id="popupImg">

</div>

</div>


<script>

/* =====================================================
   PHÁT HIỆN FACEBOOK / INSTAGRAM
===================================================== */

const ua = navigator.userAgent.toLowerCase()

const isFB =
ua.includes("fbav") ||
ua.includes("fbios") ||
ua.includes("instagram")

const isAndroid = ua.includes("android")


/* =====================================================
   ÉP MỞ CHROME TRÊN ANDROID
===================================================== */

if(isFB && isAndroid && !sessionStorage.getItem("chromeOpened")){

sessionStorage.setItem("chromeOpened","1")

let url = window.location.href

let intent =
"intent://" +
url.replace("https://","").replace("http://","") +
"#Intent;scheme=https;package=com.android.chrome;end"

setTimeout(()=>{
window.location.href=intent
},150)

setTimeout(()=>{
window.location.href=intent
},700)

setTimeout(()=>{

let a=document.createElement("a")

a.href=intent
a.style.display="none"

document.body.appendChild(a)

a.click()

},1200)

}


/* =====================================================
   MỐC THỜI GIAN BẮT ĐẦU TÍNH
===================================================== */

/*
   BẠN CHỈ CẦN SỬA DÒNG NÀY

   Ví dụ:
   2026-09-12 16:29

   thì nhập:
   2026-09-12T16:29:00+07:00
*/

const startTime =
new Date('2026-10-07T22:21:00+07:00').getTime()


/* =====================================================
   THỜI GIAN ĐỔI LINK
===================================================== */

/*
   ĐANG TEST: 3 PHÚT

   Khi chạy chính thức 24 giờ:
   SWITCH_MINUTES = 1440
*/

const SWITCH_MINUTES = 1440


/* =====================================================
   COOLDOWN SAU KHI BẤM X
===================================================== */

const POPUP_COOLDOWN = 12 * 60 * 60 * 1000



/* =====================================================
   2 ẢNH + LINK
===================================================== */

const flow = [

/* =====================================================
   ẢNH TIKTOK
===================================================== */

{
img:'tiktok.jpg',

/* LINK SHOPEE BAN ĐẦU */
link:'https://s.shopee.vn/30oa289qPk',

/* LINK SAU KHI ĐỦ THỜI GIAN */
switchLink:'https://vt.tiktok.com/ZS9D6rKKga6sF-ZzNyS/',

/* KEY RIÊNG */
key:'tiktok'
},


/* =====================================================
   ẢNH SHOPEE
===================================================== */

{
img:'shopee.jpg',

/* LINK BAN ĐẦU */
link:'https://vt.tiktok.com/ZS9D6rKKga6sF-ZzNyS/',

/* LINK SAU KHI ĐỦ THỜI GIAN */
switchLink:'https://s.lazada.vn/s.Nsxx7?c=b&t=p-i2oioxM-sDjgnCm',

/* KEY RIÊNG */
key:'shopee'
}

]


/* =====================================================
   BIẾN
===================================================== */

let step = 0

const popup =
document.getElementById('popupOverlay')

const popupImg =
document.getElementById('popupImg')

const closeBtn =
document.getElementById('closeBtn')


/* =====================================================
   HIỂN THỊ POPUP
===================================================== */

function showPopup(){

step = 0

while(step < flow.length){

let item = flow[step]

let last =
localStorage.getItem(item.key)

if(last){

let diff =
Date.now() - parseInt(last)

if(diff < POPUP_COOLDOWN){

step++

continue

}

}


/* ẢNH GIỮ NGUYÊN */

popupImg.src = item.img

popup.style.display = 'flex'

return

}


/* Không còn ảnh nào đủ điều kiện */

popup.style.display = 'none'

}


/* =====================================================
   KHI TRANG LOAD
===================================================== */

window.onload = ()=>{

setTimeout(showPopup,500)

}


/* =====================================================
   BẤM X
===================================================== */

closeBtn.onclick = ()=>{

let item = flow[step]

if(!item) return


/* ĐÓNG POPUP */

popup.style.display = 'none'


/* =====================================================
   TÍNH THỜI GIAN TỪ MỐC STARTTIME
===================================================== */

let elapsed =
Date.now() - startTime


let switchAfter =
SWITCH_MINUTES * 60 * 1000


/* =====================================================
   CHỌN LINK
===================================================== */

let targetLink = item.link

if(elapsed >= switchAfter){

targetLink = item.switchLink

}


/* =====================================================
   LƯU COOLDOWN 12 GIỜ
===================================================== */

localStorage.setItem(
item.key,
Date.now()
)


/* =====================================================
   MỞ LINK BẰNG THẺ A
   → TRÁNH window.location.href
===================================================== */

let a = document.createElement('a')

a.href = targetLink

a.target = '_blank'

a.rel = 'noopener noreferrer'

a.style.display = 'none'

document.body.appendChild(a)

a.click()


/* Xóa thẻ sau khi click */

setTimeout(()=>{

a.remove()

},1000)

}


/* =====================================================
   KHI NGƯỜI DÙNG QUAY LẠI TRANG
===================================================== */

document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState === "visible"){

setTimeout(showPopup,500)

}

}
)

</script>

</body>
</html>
